[package]
name = "moonvault-timelock"
version = "0.1.0"
description = "MoonVault TimeLock - Lock SOL and SPL tokens until a specified date"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "moonvault_timelock"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []

[dependencies]
anchor-lang = "0.30"
anchor-spl = "0.30"
